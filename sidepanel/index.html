<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebPilot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="harness-layout">
    <!-- 顶栏导航 -->
    <header class="harness-header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-title">WebPilot</span>
        </div>
        <div id="status-badge" class="status-indicator status-idle" title="当前运行状态">
          <span class="indicator-dot"></span>
          <span class="indicator-text">就绪</span>
        </div>
        <div id="active-model-tag" class="active-model-tag hidden" title="当前生效的供应商与模型"></div>
      </div>

      <div class="header-right">
        <span id="step-badge" class="step-badge hidden">第 0 / 0 步</span>
        <button id="theme-toggle-btn" class="icon-button" title="切换明暗主题" aria-label="切换主题">
          <!-- 太阳图标（亮色模式显示） -->
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- 月亮图标（暗色模式显示） -->
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <button id="clear-history-btn" class="icon-button" title="清空会话" aria-label="清空会话">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>

        <button id="settings-toggle-btn" class="icon-button" title="模型与接口配置" aria-label="配置">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 配置页，占满顶栏以下区域 -->
    <section id="settings-view" class="settings-view" hidden>
      <div class="settings-scroll">
        <div class="settings-top">
          <h2 class="settings-top-title">配置</h2>
          <span id="save-state" class="save-state" aria-live="polite"></span>
          <button type="button" id="settings-close-btn" class="link-btn">关闭</button>
        </div>
        <p id="settings-alert" class="settings-alert" hidden></p>

        <section class="settings-block">
          <div class="block-title">
            <span>选择</span>
            <button type="button" id="add-provider-btn" class="link-btn" hidden>新建供应商</button>
          </div>
          <div id="provider-empty" class="settings-empty">
            <p>还没有供应商</p>
            <button type="button" id="add-provider-empty" class="primary-btn">新建供应商</button>
          </div>
          <div id="picker" hidden>
            <label class="settings-label picker-label" for="provider-select">供应商</label>
            <select id="provider-select"></select>
            <div id="model-picker" class="model-picker">
              <label class="settings-label" for="model-select">模型</label>
              <p id="model-scope" class="field-hint"></p>
              <div class="field-row">
                <select id="model-select"></select>
                <button type="button" id="test-model-btn" class="ghost-btn" disabled>测试</button>
              </div>
              <p id="model-test-result" class="model-test-result" hidden></p>
              <div class="field-row model-add-row">
                <input type="text" id="new-model-input" spellcheck="false" autocomplete="off" placeholder="添加到此供应商" />
                <button type="button" id="add-model-btn" class="primary-btn">添加</button>
              </div>
              <button type="button" id="remove-model-btn" class="link-btn remove-model-btn" hidden>移除当前模型</button>
            </div>
          </div>
        </section>

        <section class="settings-block" id="provider-fields" hidden>
          <div class="block-title">
            <span>此供应商</span>
          </div>
          <label class="settings-label" for="provider-name-input">名称</label>
          <input type="text" id="provider-name-input" spellcheck="false" autocomplete="off" placeholder="供应商名称" />
          <label class="settings-label" for="base-url-input">API Base URL</label>
          <input type="text" id="base-url-input" spellcheck="false" autocomplete="off" placeholder="https://api.openai.com/v1" />
          <label class="settings-label" for="api-key-input">API Key</label>
          <div class="field-row">
            <input type="password" id="api-key-input" spellcheck="false" autocomplete="new-password" placeholder="本地服务可留空" />
            <button type="button" id="toggle-key-btn" class="ghost-btn">显示</button>
          </div>
          <button type="button" id="delete-provider-btn" class="danger-btn">删除此供应商</button>
        </section>

        <section class="settings-block">
          <div class="block-title">
            <span>运行</span>
          </div>
          <div class="step-row">
            <label for="max-steps-input">步数上限</label>
            <input type="number" id="max-steps-input" min="1" max="50" value="20" />
          </div>
          <label class="check-row" title="把当前视口截图发给模型">
            <input type="checkbox" id="vision-toggle" />
            <span>视口截图</span>
          </label>
          <label class="check-row" title="用系统级输入事件点击，而不是页面脚本模拟">
            <input type="checkbox" id="cdp-toggle" />
            <span>CDP 硬件事件</span>
          </label>
        </section>

      </div>
    </section>

    <!-- 中部消息流主体 -->
    <main id="conversation-stream" class="conversation-stream"></main>

    <!-- 底部置底输入栏 -->
    <footer class="harness-footer">
      <div class="input-card">
        <textarea id="task-input" rows="1" placeholder="输入操作目标或任务... (Enter 发送)"></textarea>

        <div class="input-actions-bar">
          <div class="action-left-group">
            <button id="pause-resume-btn" class="action-btn" title="暂停/恢复执行" disabled>
              <svg id="pause-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="6" y="4" width="4" height="16"></rect>
                <rect x="14" y="4" width="4" height="16"></rect>
              </svg>
              <svg id="resume-icon" class="hidden" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="5 3 19 12 5 21 5 3"></polygon>
              </svg>
              <span id="pause-btn-text">暂停</span>
            </button>

            <button id="stop-btn" class="action-btn danger" title="停止执行" disabled>
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="4" y="4" width="16" height="16" rx="2"></rect>
              </svg>
              <span>停止</span>
            </button>
          </div>

          <div class="action-right-group">
            <button id="send-btn" class="send-button" title="开始执行">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
